{% extends "properties/layout/admin_base.html" %}

{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold mb-4">Delete user</h1>
    <p class="mb-4">Are you sure you want to delete <strong>{{ user_obj.username }}</strong>?</p>
    <form method="post" class="flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-error">Delete</button>
        <a href="{% url 'user_list' %}" class="btn">Cancel</a>
    </form>
</div>
{% endblock %}
