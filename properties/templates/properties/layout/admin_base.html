{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Reservations Manager{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'properties/css/my_tailwind.css' %}">
</head>
<body>
    <div class="navbar bg-base-300 text-base-content shadow-sm">
        <div class="navbar-start">
            <a href="{% url 'home' %}" class="btn btn-ghost text-xl">Reservations Manager</a>
        </div>
        <div class="navbar-end gap-6 pr-3">
            <div class="dropdown dropdown-hover dropdown-end">
                <div tabindex="0" role="button" class="btn btn-square btn-ghost" aria-label="Admin settings">
                    <svg aria-label="Menu" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block h-5 w-5 stroke-current"> <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path> </svg>
                </div>
                <ul tabindex="-1" class="dropdown-content menu bg-base-200 text-base-content rounded-box z-10 w-40 p-2 shadow-sm">
                    <li><a href="{% url 'user_list' %}">Users</a></li>
                    <li>
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="w-full text-left">Log out</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <main class="p-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
